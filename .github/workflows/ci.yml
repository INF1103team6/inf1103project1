name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r library.txt
      - run: python -m pytest tests/ -v || [ $? -eq 5 ]
      - run: docker build -t safety-triage .
